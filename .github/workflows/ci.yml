name: CI

on:
  push:
    branches: [main, 'security/**']
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test -- --run

  gitleaks:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Run gitleaks detect
        uses: zricethezav/gitleaks-action@v2
        with:
          args: detect --source . --no-git -v
