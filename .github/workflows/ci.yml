name: CI

on:
  push:
    branches: [main, 'security/**']
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test -- --run

  test-with-redis:
    name: Run tests with Redis (integration)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 5
    env:
      REDIS_URL: redis://127.0.0.1:6379
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm ci
      - name: Run tests (with REDIS)
        env:
          REDIS_URL: redis://127.0.0.1:6379
        run: npm test -- --run

  gitleaks:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    needs: [test, test-with-redis]
    steps:
      - uses: actions/checkout@v4
      - name: Run gitleaks detect
        uses: zricethezav/gitleaks-action@v2
        with:
          args: detect --source . --no-git -v
