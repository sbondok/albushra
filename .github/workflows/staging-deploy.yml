name: Staging Deploy

on:
  push:
    branches: ['staging', 'staging/**']
  workflow_dispatch: {}

env:
  IMAGE_REGISTRY: ${{ secrets.REGISTRY }}
  IMAGE_NAME: ${{ secrets.REGISTRY }}/albushra
  STAGING_NAMESPACE: staging
  STAGING_URL: ${{ secrets.STAGING_URL }}

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.set-image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install & Test
        run: npm ci && npm test -- --run

      - name: Login to registry
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push image
        id: build
        run: |
          IMAGE=${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker buildx build --platform linux/amd64 -t "$IMAGE" --push .
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

      - name: Set image output
        id: set-image
        run: echo "image=${{ env.IMAGE_NAME }}:${{ github.sha }}" >> $GITHUB_OUTPUT

  deploy:
    needs: build-and-publish
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure Kubeconfig
        run: |
          echo "$KUBE_CONFIG" | base64 --decode > kubeconfig
          export KUBECONFIG=$(pwd)/kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}

      - name: Ensure Redis in staging
        run: |
          kubectl -n ${{ env.STAGING_NAMESPACE }} apply -f k8s/staging/redis-deployment.yaml || true
          kubectl -n ${{ env.STAGING_NAMESPACE }} rollout status deployment/albushra-redis --timeout=60s || true

      - name: Deploy image to staging
        run: |
          IMAGE=${{ needs.build-and-publish.outputs.image }}
          kubectl -n ${{ env.STAGING_NAMESPACE }} set image deployment/albushra-fees-system albushra-app=$IMAGE --record || kubectl -n ${{ env.STAGING_NAMESPACE }} apply -f k8s/staging/deployment.yaml

      - name: Wait for rollout
        run: |
          kubectl -n ${{ env.STAGING_NAMESPACE }} rollout status deployment/albushra-fees-system --timeout=120s

      - name: Run DB migrations
        run: |
          IMAGE=${{ needs.build-and-publish.outputs.image }}
          kubectl -n ${{ env.STAGING_NAMESPACE }} run migrate-$$ --restart=OnFailure --image=$IMAGE --command -- npx prisma migrate deploy --preview-feature || true

      - name: Smoke test
        run: |
          if [ -z "${{ env.STAGING_URL }}" ]; then echo "STAGING_URL is not set"; exit 1; fi
          echo "Checking health..."
          curl --fail --show-error "${{ env.STAGING_URL }}/api/health"
          echo "Checking protected endpoint returns 401 (unauthenticated)..."
          status=$(curl -s -o /dev/null -w "%{http_code}" "${{ env.STAGING_URL }}/api/payments")
          if [ "$status" -ne 401 ]; then echo "Expected 401 from /api/payments, got $status"; exit 1; fi

      - name: Run e2e tests
        run: |
          echo "Running e2e tests against ${{ env.STAGING_URL }}"
          npm ci
          STAGING_URL=${{ env.STAGING_URL }} npm run test:e2e

      - name: Rollback on failure
        if: failure()
        run: |
          kubectl -n ${{ env.STAGING_NAMESPACE }} rollout undo deployment/albushra-fees-system || true

      - name: Smoke test
        run: |
          if [ -z "${{ env.STAGING_URL }}" ]; then echo "STAGING_URL is not set"; exit 1; fi
          echo "Checking health..."
          curl --fail --show-error "${{ env.STAGING_URL }}/api/health"
          echo "Checking protected endpoint returns 401 (unauthenticated)..."
          status=$(curl -s -o /dev/null -w "%{http_code}" "${{ env.STAGING_URL }}/api/payments")
          if [ "$status" -ne 401 ]; then echo "Expected 401 from /api/payments, got $status"; exit 1; fi

      - name: Rollback on failure
        if: failure()
        run: |
          kubectl -n ${{ env.STAGING_NAMESPACE }} rollout undo deployment/albushra-fees-system || true
