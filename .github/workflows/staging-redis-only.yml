name: Staging Redis Only

on:
  workflow_dispatch: {}
  push:
    branches: ['staging']

env:
  STAGING_NAMESPACE: staging

jobs:
  install-redis:
    if: ${{ secrets.KUBE_CONFIG != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure Kubeconfig
        run: |
          if [ -z "$KUBE_CONFIG" ]; then echo "KUBE_CONFIG secret is empty; aborting"; exit 1; fi
          echo "$KUBE_CONFIG" | base64 --decode > kubeconfig
          echo "KUBECONFIG=$(pwd)/kubeconfig" >> $GITHUB_ENV
          echo "Configured KUBECONFIG=$(pwd)/kubeconfig"
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}

      - name: Print kubeconfig (debug)
        run: |
          echo "--- kubeconfig head ---"
          sed -n '1,200p' kubeconfig || true

      - name: Debug kubectl config
        run: |
          kubectl config view --minify || true
          kubectl config current-context || true
          kubectl version --client=true || true

      - name: Ensure Redis in staging (Helm or manifest)
        run: |
          set -euo pipefail
          if [ "${{ env.USE_HELM_REDIS }}" = "true" ]; then
            echo "Installing HA Redis via in-repo Helm chart..."
            helm upgrade --install albushra-redis k8s/staging/helm/redis-chart -n ${{ env.STAGING_NAMESPACE }} --create-namespace --wait --timeout=300s \
              --set "redis.password=${{ secrets.STAGING_REDIS_PASSWORD }}" \
              --set replicaCount=3
          else
            echo "Applying lightweight Redis manifest..."
            kubectl -n ${{ env.STAGING_NAMESPACE }} apply -f k8s/staging/redis-deployment.yaml || true
            kubectl -n ${{ env.STAGING_NAMESPACE }} rollout status deployment/albushra-redis --timeout=300s || true
          fi

      - name: Wait for pods to be Ready and collect timings
        run: |
          set -euo pipefail
          echo "Waiting for all Redis pods to be ready (timeout 300s)..."
          kubectl -n ${{ env.STAGING_NAMESPACE }} wait --for=condition=Ready pod -l app=albushra-redis --timeout=300s || true

          echo "Collecting pod start and ready timestamps:"
          kubectl -n ${{ env.STAGING_NAMESPACE }} get pods -l app=albushra-redis -o jsonpath='{range .items[*]}{.metadata.name} {.status.startTime} {.status.conditions[?(@.type=="Ready")].lastTransitionTime}{"\n"}{end}'

          echo "Showing pod events (last 200 lines each):"
          for p in $(kubectl -n ${{ env.STAGING_NAMESPACE }} get pods -l app=albushra-redis -o name); do
            echo "=== $p ==="
            kubectl -n ${{ env.STAGING_NAMESPACE }} describe $p | sed -n '1,200p'
            kubectl -n ${{ env.STAGING_NAMESPACE }} logs $p --tail=200 || true
          done

      - name: Optional app health check
        if: env.STAGING_URL != ''
        run: |
          if [ -z "${{ env.STAGING_URL }}" ]; then echo "STAGING_URL not set, skipping app health check"; exit 0; fi
          echo "Checking app health endpoint..."
          curl --fail --show-error "${{ env.STAGING_URL }}/api/health" || true

  local-kind:
    runs-on: ubuntu-latest
    needs: []
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Install kind binary
        run: |
          curl -Lo kind "https://kind.sigs.k8s.io/dl/v0.21.0/kind-linux-amd64"
          chmod +x kind
          sudo mv kind /usr/local/bin/kind

      - name: Create kind cluster
        run: |
          kind create cluster --name staging-test --wait 120s
          kubectl cluster-info --context kind-staging-test

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Export kubeconfig for kind
        run: |
          kind get kubeconfig --name staging-test > kubeconfig
          echo "KUBECONFIG=$(pwd)/kubeconfig" >> $GITHUB_ENV

      - name: Install Helm
        uses: azure/setup-helm@v3

      - name: Install HA Redis via Helm (local Kind)
        run: |
          helm upgrade --install albushra-redis k8s/staging/helm/redis-chart --wait --timeout=300s --set redis.password=changeme --set replicaCount=1 || true

      - name: Wait and capture timings
        run: |
          kubectl -n default wait --for=condition=Ready pod -l app=albushra-redis --timeout=300s || true
          kubectl -n default get pods -l app=albushra-redis -o jsonpath='{range .items[*]}{.metadata.name} {.status.startTime} {.status.conditions[?(@.type=="Ready")].lastTransitionTime}{"\n"}{end}'

      - name: Collect logs
        run: |
          for p in $(kubectl -n default get pods -l app=albushra-redis -o name); do
            echo "=== $p ==="
            kubectl -n default describe $p || true
            kubectl -n default logs $p --tail=200 || true
          done

      - name: Teardown kind cluster
        if: always()
        run: |
          kind delete cluster --name staging-test || true
