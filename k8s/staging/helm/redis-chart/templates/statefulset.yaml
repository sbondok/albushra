apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: albushra-redis
  labels:
    app: albushra-redis
spec:
  selector:
    matchLabels:
      app: albushra-redis
  serviceName: albushra-redis-headless
  replicas: {{ .Values.replicaCount }}
  template:
    metadata:
      labels:
        app: albushra-redis
    spec:
      containers:
        - name: redis
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
              name: redis
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: albushra-redis-secret
                  key: redis-password
          args:
            - "--requirepass"
            - "$(REDIS_PASSWORD)"
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: {{ .Values.service.port }}
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
