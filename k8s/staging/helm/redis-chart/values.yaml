# Default values for albushra-redis
replicaCount: 3

image:
  repository: redis
  tag: "7-alpine"
  pullPolicy: IfNotPresent

redis:
  # Set a non-empty password for HA deployments. You can pass via --set redis.password=<pw>
  password: ""

resources: {}

persistence:
  enabled: true
  size: 1Gi

service:
  port: 6379
  type: ClusterIP

# Probe configuration (tunable for slower startup or heavier persistence loads)
probes:
  readiness:
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 12
  liveness:
    initialDelaySeconds: 60
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 5

nodeSelector: {}

tolerations: []

affinity: {}
